<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile card for Muhammad Abdullah</title>
  <desc id="desc">Terminal-inspired introduction for a data analyst and AI machine-learning developer in Karachi.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0f172a"/><stop offset="1" stop-color="#030712"/></linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".48" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6" stop-opacity=".2"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399" stop-opacity=".2"/></linearGradient>
    <radialGradient id="orbA"><stop stop-color="#8b5cf6" stop-opacity=".26"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".35"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence baseFrequency=".75" numOctaves="3" seed="7" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer></filter>
    <clipPath id="frameClip"><rect x="10" y="10" width="1160" height="590" rx="30"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace; }
    .label { fill:#94a3b8; font-size:13px; font-weight:600; letter-spacing:1.6px; }
    .value { fill:#f8fafc; font-size:16px; font-weight:500; }
    .ascii { fill:url(#accentGradient); font-size:26px; font-weight:700; filter:url(#glow); letter-spacing:-1px; }
    .line { opacity:0; animation: reveal 9s ease infinite; }
    .line-1 { animation-delay:.2s } .line-2 { animation-delay:.38s } .line-3 { animation-delay:.56s }
    .line-4 { animation-delay:.74s } .line-5 { animation-delay:.92s } .line-6 { animation-delay:1.1s }
    .portrait { animation: float 6s ease-in-out infinite; transform-origin:270px 300px; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    .role { opacity:0; animation: roleCycle 12s steps(16,end) infinite; clip-path:inset(0 100% 0 0); }
    .role-2 { animation-delay:4s } .role-3 { animation-delay:8s }
    .info { opacity:0; animation: infoReveal 9s ease infinite; }
    .i2 { animation-delay:.18s } .i3 { animation-delay:.36s } .i4 { animation-delay:.54s }
    .chip rect { fill:#111b2e; stroke:#26334a; } .chip circle { fill:#34d399; }
    .chip text { fill:#f8fafc; font-size:12px; font-weight:600; } .chip { animation: chipPulse 4.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .scan { animation: scan 5s linear infinite; }
    .particle { animation: drift 5s ease-in-out infinite alternate; }
    .p2,.p5 { animation-delay:-1s } .p3,.p7 { animation-delay:-2.4s } .p4,.p8 { animation-delay:-3.6s }
    .edge { stroke-dasharray:220 1600; animation: edge 7s linear infinite; }
    @keyframes reveal { 0%,5%{opacity:0;transform:translateX(-9px)} 14%,88%{opacity:1;transform:translateX(0)} 96%,100%{opacity:0} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
    @keyframes roleCycle { 0%{opacity:0;clip-path:inset(0 100% 0 0)} 7%,24%{opacity:1;clip-path:inset(0 0 0 0)} 29%,100%{opacity:0;clip-path:inset(0 0 0 0)} }
    @keyframes infoReveal { 0%,10%{opacity:0;transform:translateY(8px)} 20%,90%{opacity:1;transform:translateY(0)} 100%{opacity:0} }
    @keyframes chipPulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes scan { from{transform:translateY(-160px)} to{transform:translateY(300px)} }
    @keyframes drift { from{transform:translate(0,0);opacity:.25} to{transform:translate(8px,-12px);opacity:.7} }
    @keyframes edge { to{stroke-dashoffset:-1760} }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important } .line,.role,.info{opacity:1;clip-path:none} .role-2,.role-3{display:none} }
  </style>
