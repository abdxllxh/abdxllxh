<text x="84" y="411" class="ascii line line-6">╚═╝     ╚═╝ ╚═╝  ╚═╝</text>
    <rect x="77" y="458" width="373" height="50" rx="14" fill="#0f172a" stroke="#26334a"/>
    <circle cx="100" cy="483" r="5" fill="#34d399" filter="url(#glow)"/><text x="116" y="489" fill="#f8fafc" font-size="14">available for ambitious builds</text>
